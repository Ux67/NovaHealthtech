name: Nova Healthtech CI

on:
  push:
    branches: [main, "novahealthtech-2.0/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-backend-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python modules
        run: python -m compileall -q backend
      - name: Check frontend JavaScript syntax
        run: node --check frontend/script.js
      - name: Ensure Android WebView assets match website
        run: |
          cmp frontend/index.html android_companion/app/src/main/assets/index.html
          cmp frontend/script.js android_companion/app/src/main/assets/script.js
          cmp frontend/style.css android_companion/app/src/main/assets/style.css
      - name: Check non-blocking notifications and compact language selector
        run: |
          ! grep -Eq 'alert[[:space:]]*\(' frontend/script.js
          ! grep -q 'lang-selector-panel' frontend/script.js
          grep -q 'android.permission.CALL_PHONE' android_companion/app/src/main/AndroidManifest.xml
          grep -q 'executeBackgroundEmergencyCall(targetNumber, candidateImpactPeakMs2)' android_companion/app/src/main/java/in/novahealthtech/companion/AccidentDetectionService.kt
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK path
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build Android debug APK
        run: gradle -p android_companion assembleDebug --no-daemon
