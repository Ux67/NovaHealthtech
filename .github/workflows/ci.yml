name: Nova Healthtech CI

on:
  push:
    branches: [main, "novahealthtech-2.0/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-backend-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python modules
        run: python -m compileall -q backend
      - name: Check frontend JavaScript syntax
        run: node --check frontend/script.js
      - name: Ensure Android WebView assets match website
        run: |
          cmp frontend/index.html android_companion/app/src/main/assets/index.html
          cmp frontend/script.js android_companion/app/src/main/assets/script.js
          cmp frontend/style.css android_companion/app/src/main/assets/style.css
      - name: Check non-blocking notifications and compact language selector
        run: |
          ! grep -Eq 'alert[[:space:]]*\(' frontend/script.js
          ! grep -q 'lang-selector-panel' frontend/script.js
